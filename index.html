<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revelo: Games in Gemini 4 Argon &amp; Revelo Redesign OTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
:root{
  --bg:#0E0E0D; --panel:#171716; --sunk:#131312; --stage:#0A0A09; --hover:#232322;
  --line:#2A2A28; --line-soft:#222221; --sel:#1C2236;
  --text:#ECEBE7; --text-2:#DCDBD6; --text-3:#C4C3BE; --dim:#9A9993; --faint:#4A4945;
  --accent:#7C9BFF; --accent-2:#A9BEFF;
  --pass:#6FCB94; --pass-bg:#15301F; --mid:#C98A1A; --fail:#E0634B; --fail-fg:#F08A75; --fail-bg:#3A1C17;
  --why-fg:#F2A193; --why-bg:#2A1714;
  --ui:'Geist','Helvetica Neue',Arial,sans-serif;
  --mono:'Geist Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--ui);font-size:14px;line-height:1.5;
     -webkit-font-smoothing:antialiased;color-scheme:dark}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)} a:hover{color:var(--accent-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.page{min-height:100vh;display:flex;flex-direction:column}

/* top bar */
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 28px;
     background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:28px;height:28px;border-radius:7px;background:var(--text);color:var(--panel);
      display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.brand b{font-weight:600;font-size:15px;letter-spacing:-.01em}
.slash{color:var(--faint)}
.sub{font-size:14px;color:#A9A8A2}

.layout{display:flex;flex-wrap:wrap;flex:1;min-height:0}

/* sidebar */
.nav{flex:0 0 184px;max-width:100%;padding:20px 10px;background:var(--panel);
     border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.layout.collapsed .nav{display:none}
.nav-toggle{display:flex;align-items:center;justify-content:center;width:32px;height:32px;margin-left:-6px;padding:0;
            border:1px solid transparent;border-radius:8px;background:none;color:var(--dim)}
.nav-toggle:hover{background:var(--hover);color:var(--text)}
.nav-h{padding:0 10px 8px;font-size:12px;font-weight:500;color:var(--dim);letter-spacing:.02em}
.nav-item{display:block;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:8px;
          background:transparent;font-weight:500;font-size:13.5px;color:var(--text-3);
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item:hover{background:var(--hover)}
.nav-item.sel{background:var(--hover);color:var(--text)}

/* main */
.main{flex:999 1 560px;min-width:0;padding:32px 40px 64px}
.wrap{max-width:1120px;width:100%;display:flex;flex-direction:column;gap:28px}
/* with the menu hidden, the content (and the preview) grows into the freed space, up to the render width */
.layout.collapsed .wrap{max-width:1600px}

.head{display:flex;flex-direction:column;gap:12px}
.kicker{font-size:12px;font-weight:500;color:var(--dim);letter-spacing:.02em}
.head h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.025em;line-height:1.2}
.prompt{display:flex;flex-direction:column;gap:6px;max-width:78ch}
.label{font-size:12px;font-weight:500;color:var(--dim)}
.ptext{margin:0;font-size:14.5px;line-height:1.6;color:var(--text-3);text-wrap:pretty;white-space:pre-wrap;
       display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ptext.open{display:block}
.link{align-self:flex-start;background:none;border:0;padding:0;font-size:13px;font-weight:500;color:var(--accent)}
.link:hover{text-decoration:underline}

/* version tabs */
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tab{display:flex;align-items:center;gap:8px;padding:10px 14px;margin-bottom:-1px;border:0;
     border-bottom:2px solid transparent;background:none;font-size:14px;font-weight:500;color:var(--dim)}
.tab:hover{color:var(--text)}
.tab.sel{color:var(--text);border-bottom-color:var(--accent)}
.tab .sc{font-family:var(--mono);font-size:12px;font-weight:400;font-variant-numeric:tabular-nums}

/* stage */
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stage-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.stage-id{display:flex;flex-direction:column;min-width:0;flex:1 1 200px}
.stage-id b{font-weight:600;font-size:14px}
.stage-id span{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:4px;flex-wrap:wrap}
.tool{display:flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0;
      border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px;font-weight:500}
.tool.text{padding:0 12px}
.tool:hover{background:var(--hover)}
.tool.on{background:var(--hover);border-color:#55544F}
.tool:disabled{opacity:.4;cursor:not-allowed}
.tool:disabled:hover{background:var(--panel)}
.tool svg{display:block}

#notesbox[hidden]{display:none}
.notes-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.notes-box summary{display:flex;align-items:center;gap:8px;padding:14px 18px;cursor:pointer;list-style:none;
                   font-size:14px;font-weight:600;user-select:none}
.notes-box summary::-webkit-details-marker{display:none}
.notes-box summary small{font-size:12.5px;font-weight:400;color:var(--dim)}
.notes-box summary::after{content:'';margin-left:auto;width:0;height:0;border-left:5px solid var(--dim);
                          border-top:5px solid transparent;border-bottom:5px solid transparent;transition:transform .15s}
.notes-box[open] summary::after{transform:rotate(90deg)}
.notes-box summary:hover{background:var(--hover)}
.notes{padding:16px 20px;max-height:60vh;overflow-y:auto;background:var(--sunk);border-top:1px solid var(--line);
       font-size:13.5px;color:var(--text-3)}
.notes h1{font-size:15px;margin:0 0 10px;color:var(--text)}
.notes h2{font-size:13.5px;margin:16px 0 6px;color:var(--text)}
.notes h3{font-size:13px;margin:14px 0 6px;color:var(--text)}
.notes p,.notes ul,.notes ol{margin:0 0 10px;max-width:78ch}
.notes ul,.notes ol{padding-left:20px}
.notes li{margin:0 0 4px}
.notes strong{color:var(--text);font-weight:600}
.notes blockquote{margin:0 0 10px;padding:8px 12px;background:var(--panel);border-radius:8px;white-space:pre-wrap;max-width:78ch}
.notes code{font-family:var(--mono);font-size:12px;background:var(--hover);padding:1px 5px;border-radius:4px}
.notes hr{border:0;border-top:1px solid var(--line);margin:16px 0}

.holder{width:100%;aspect-ratio:16/9;max-height:80vh;background:var(--stage);position:relative;overflow:hidden}
.holder iframe,.holder model-viewer{width:100%;height:100%;border:0;display:block}
/* games render 900px tall at the box's shape and shrink to it, so their HUD keeps full-screen proportions */
.holder iframe.scaled{position:absolute;left:50%;top:50%;width:var(--fw,1600px);height:900px;
                      transform:translate(-50%,-50%) scale(var(--fit,1))}
.holder model-viewer{background:var(--stage);--poster-color:transparent}
.holder:fullscreen{height:100%}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
       text-align:center;padding:24px}
.empty b{color:#E8E7E3;font-size:14px;font-weight:500}
.empty span{color:#9C9B95;font-size:13px}
.empty code{font-family:var(--mono);font-size:12px;background:var(--hover);padding:1px 5px;border-radius:4px;color:var(--text)}

/* rubric */
.rubric{display:flex;flex-direction:column;gap:14px}
.rubric-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rubric-h h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.015em}
.rubric-h span{font-size:13px;color:var(--dim)}
.table{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
.table-in{min-width:640px}
.grid{display:grid;align-items:stretch}
.grid.hrow{border-bottom:1px solid var(--line)}
.grid.r{border-top:1px solid var(--line-soft)}
.grid.r:hover{background:#1B1B1A}
/* header cells share the body cells' padding and divider, so the columns line up */
.th{display:flex;align-items:center;justify-content:center;padding:12px 8px;text-align:center;
    font-size:12px;font-weight:500;color:var(--dim);line-height:1.35;border-left:1px solid var(--line-soft)}
.th:first-child{justify-content:flex-start;padding:12px 20px;text-align:left;border-left:0}
.th.on{font-weight:600;color:var(--text);background:var(--sel)}
.tier{padding:18px 20px 8px;font-size:12px;font-weight:600;color:var(--text);letter-spacing:.01em;
      border-top:1px solid var(--line);background:var(--sunk)}
.crit{padding:14px 20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.crit .q{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.area{font-family:var(--mono);font-size:11.5px;color:#A9A8A2;background:var(--hover);border-radius:5px;padding:1px 7px}
.desc{font-size:14px;color:var(--text-2)}
.why{align-self:flex-start;font-size:13px;color:var(--why-fg);background:var(--why-bg);
     border-radius:8px;padding:6px 12px;max-width:72ch}
.why summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;
             font-size:12.5px;font-weight:500;user-select:none}
.why summary::-webkit-details-marker{display:none}
.why summary svg{flex:none}
.why summary::after{content:'';width:0;height:0;margin-left:2px;border-left:4px solid currentColor;
                    border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
.why[open]{align-self:stretch}
.why[open] summary::after{transform:rotate(90deg)}
.why summary:hover{text-decoration:underline}
.why p{margin:6px 0 2px 22px}
.cell{display:flex;align-items:center;justify-content:center;padding:12px 8px;border-left:1px solid var(--line-soft)}
.cell.on{background:var(--sel)}
.dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;border:0}
.dot.y{background:var(--pass-bg);color:var(--pass)}
.dot.n{background:var(--fail-bg);color:var(--fail-fg)}
button.dot.n:hover{background:#4A2219}
.u{color:#A5A49E;font-size:14px}
.num{font-family:var(--mono);font-size:14px;font-weight:500}
.num small{color:#8C8B85;font-size:12px}
.tot-l{padding:12px 20px;font-size:13.5px;color:var(--text-3)}
.tot-v{padding:12px 8px;text-align:center;font-size:13.5px;font-family:var(--mono);font-variant-numeric:tabular-nums;
       border-left:1px solid var(--line-soft)}
.tot-v.on{background:var(--sel)}
.strong .tot-l{font-weight:600;color:var(--text)} .strong .tot-v{font-weight:600}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

@media (max-width:700px){
  .bar{padding:12px 16px}
  .nav{flex-basis:100%;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  .main{padding:24px 16px 48px}
}
</style>
</head>
<body>
<div class="page">
  <header class="bar">
    <button class="nav-toggle" id="navtoggle" aria-controls="nav" aria-expanded="true"
            aria-label="Hide game menu" title="Hide game menu (M)"></button>
    <div class="brand"><div class="logo">R</div><b>Revelo</b></div>
    <span class="slash" aria-hidden="true">/</span>
    <span class="sub">Games in Gemini 4 Argon &amp; Revelo Redesign OTS</span>
  </header>

  <div class="layout" id="layout">
    <nav class="nav" id="nav" aria-label="Games"></nav>

    <main class="main">
      <div class="wrap">
        <section class="head" id="head"></section>
        <section class="tabs" id="cards" role="tablist" aria-label="Versions"></section>

        <section class="stage">
          <div class="stage-bar" id="stagebar"></div>
          <div class="holder" id="holder"></div>
        </section>

        <section id="notesbox" hidden></section>

        <section class="rubric" id="rubric"></section>
      </div>
    </main>
  </div>
</div>

<script src="games.js"></script>
<script>
const DATA  = window.GAMES || [];
const state = { game:0, col:0, open:false, notes:false };

const esc   = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const plain = s => esc(String(s ?? '').replace(/\*\*/g,''));
const cur   = () => DATA[state.game]?.versions?.[state.col];
const $     = id => document.getElementById(id);

const ICON = {
  notes:  '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/>',
  dl:     '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>',
  reload: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  full:   '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>',
  side:   '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',
  cube:   '<path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5"/><path d="M12 12v10"/>',
  check:  '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  x:      '<path d="M6 6l12 12M18 6 6 18"/>',
  alert:  '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/>',
};
const svg = (name, size=15, sw=1.8, extra='') =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${ICON[name]}</svg>`;

/* ---------- scores, computed from marks ----------
   Questions with `rating: true` take a 1–5 number; every other question is a
   pass/fail check. null (or a missing mark) means "not scored yet". */
function score(g, v){
  const qs = g.questions || [], marks = v.marks || [];
  const out = { passed:0, total:0, scored:false, tiers:{}, ratings:[] };
  qs.forEach((q,i) => {
    const m = marks[i];
    if (m !== null && m !== undefined) out.scored = true;
    if (q.rating){ if (typeof m === 'number') out.ratings.push(m); return; }
    const t = out.tiers[q.tier] ||= [0,0];
    t[1]++; out.total++;
    if (m === true){ t[0]++; out.passed++; }
  });
  out.avg = out.ratings.length ? out.ratings.reduce((a,b) => a+b, 0) / out.ratings.length : null;
  return out;
}
const scoreText = s => s.scored ? s.passed + '/' + s.total : '—';
const ratio     = s => s.scored && s.total ? s.passed / s.total : null;

/* ---------- sidebar ---------- */
function drawNav(){
  $('nav').innerHTML = `<div class="nav-h">Games</div>` + DATA.map((g,i) =>
    `<button class="nav-item ${i===state.game?'sel':''}" data-i="${i}">${esc(g.nav || g.title)}</button>`).join('');
  $('nav').querySelectorAll('.nav-item').forEach(b =>
    b.onclick = () => go(+b.dataset.i, 0));
}

/* ---------- scene header ---------- */
function drawHead(){
  const g = DATA[state.game];
  if (!g){ $('head').innerHTML = '<h1>No games yet</h1>'; return; }
  $('head').innerHTML = `
    <div class="kicker">Game ${state.game + 1} of ${DATA.length}</div>
    <h1>${esc(g.title)}</h1>
    ${g.description ? `<div class="prompt">
      <div class="label">${esc(g.descLabel || 'Prompt')}</div>
      <p class="ptext ${state.open?'open':''}" id="ptext">${esc(g.description)}</p>
      <button class="link" id="expand" hidden>${state.open ? 'Show less' : 'Show more'}</button>
    </div>` : ''}`;
  const p = $('ptext'), ex = $('expand');
  if (!p) return;
  ex.hidden = !state.open && p.scrollHeight <= p.clientHeight + 1;   // short prompt: no toggle
  ex.onclick = () => { state.open = !state.open; drawHead(); };
}

/* ---------- version tabs ---------- */
function drawCards(){
  const g = DATA[state.game];
  if (!g){ $('cards').innerHTML = ''; return; }
  $('cards').innerHTML = (g.versions || []).map((v,i) => {
    const s = score(g,v), r = ratio(s);
    const color = r === null ? 'var(--dim)' : r >= 1 ? 'var(--pass)' : r >= .5 ? 'var(--mid)' : 'var(--fail)';
    return `<button class="tab ${i===state.col?'sel':''}" role="tab" aria-selected="${i===state.col}" data-k="${i}">
      ${esc(v.label)}${(g.questions||[]).length ? `<span class="sc" style="color:${color}" title="Checks passed">${scoreText(s)}</span>` : ''}</button>`;
  }).join('');
  $('cards').querySelectorAll('.tab').forEach(b =>
    b.onclick = () => go(state.game, +b.dataset.k));
}

/* ---------- stage ---------- */
function drawStage(){
  const v = cur(), t = trajectoryOf();
  $('stagebar').innerHTML = !v ? '' : `
    <div class="stage-id"><b>${esc(v.label)}</b><span>${esc(v.file || 'No file registered')}</span></div>
    <div class="tools">
      <button class="tool" id="traj" aria-label="Download trajectory"
              title="${esc(t ? `Download trajectory (${fileName(t)})` : 'No trajectory for this version')}" ${t ? '' : 'disabled'}>${svg('dl')}</button>
      <button class="tool" id="reload" aria-label="Restart game" title="Restart (R)">${svg('reload')}</button>
      <button class="tool" id="full" aria-label="Open full screen" title="Full screen (F)">${svg('full')}</button>
    </div>`;
  drawNotes();
  if (!v) return;
  if (t) $('traj').onclick = downloadTrajectory;
  $('reload').onclick = loadScene;
  $('full').onclick = openFull;
}

/* ---------- notes: collapsible section under the preview ---------- */
function drawNotes(){
  const box = $('notesbox'), v = cur();
  box.hidden = !v?.notes;
  if (box.hidden){ box.innerHTML = ''; return; }
  box.innerHTML = `<details class="notes-box" id="notesdetails" ${state.notes ? 'open' : ''}>
      <summary>${svg('notes')}<span>Notes</span><small>${esc(v.label)}</small></summary>
      <div class="notes">${md(v.notes)}</div>
    </details>`;
  $('notesdetails').ontoggle = e => { state.notes = e.target.open; };
}

function emptyStage(title, sub){
  $('holder').innerHTML = `<div class="empty">${svg('cube', 40, 1.4, 'style="color:#8C8B85"')}
    <b>${title}</b><span>${sub}</span></div>`;
}

let loadToken = 0, loadedKey = null;                 // ignore errors from a scene we already left
function loadScene(){
  const holder = $('holder');
  const v = cur(), token = ++loadToken;
  loadedKey = state.game + ':' + state.col;
  if (!v || !v.file){
    emptyStage('No game here yet', 'Drop the file into a folder next to this page and register it in <code>games.js</code>');
    return;
  }
  holder.innerHTML = '';

  if (v.type === 'model'){
    const mv = document.createElement('model-viewer');  // fresh node = clean restart
    mv.setAttribute('src', v.file);
    mv.setAttribute('alt', v.label || 'Model');
    mv.setAttribute('camera-controls', '');
    mv.setAttribute('touch-action', 'pan-y');
    mv.setAttribute('shadow-intensity', '1');
    if (v.autoRotate !== false) mv.setAttribute('auto-rotate', '');
    if (v.environment) mv.setAttribute('environment-image', v.environment);
    if (v.skybox) mv.setAttribute('skybox-image', v.skybox);
    if (v.poster) mv.setAttribute('poster', v.poster);
    mv.addEventListener('error', () => {
      if (token === loadToken) emptyStage(`Couldn't load ${esc(v.file)}`,
        'Check the path, and serve this folder over http (models can\'t load from <code>file://</code>)');
    });
    holder.appendChild(mv);
    return;
  }

  const f = document.createElement('iframe');          // fresh node = clean restart
  f.title = v.label || 'Game';
  // Scenes are multi-file projects (glb, hdr, textures by relative path), so they load by URL
  // and keep their origin; inlining them as srcdoc would block those asset requests.
  f.setAttribute('sandbox','allow-scripts allow-same-origin allow-pointer-lock allow-modals allow-forms');
  f.setAttribute('allow','fullscreen; autoplay; xr-spatial-tracking; gamepad');
  f.src = v.file;
  f.className = 'scaled';
  holder.appendChild(f);
}

// Renders 900px tall and as wide as the box's shape needs (1600px at 16:9), then scales to the box,
// so it always fills the box: on short windows the box gets wider than 16:9 and the frame widens with it.
const SCENE_H = 900;                                   // keep in sync with .holder iframe.scaled
function fitScene(){
  const h = $('holder');
  if (!h.clientHeight) return;
  const fit = h.clientHeight / SCENE_H;
  h.style.setProperty('--fit', fit);
  h.style.setProperty('--fw', h.clientWidth / fit + 'px');
}
new ResizeObserver(fitScene).observe($('holder'));

function openFull(){
  const v = cur();
  if (!v || !v.file) return;
  if (v.type === 'model'){
    const h = $('holder');
    (h.requestFullscreen || h.webkitRequestFullscreen)?.call(h);
    return;
  }
  const w = window.open(v.file, '_blank');
  if (!w) alert('Your browser blocked the new tab. Allow pop-ups for this page and try again.');
}

/* ---------- notes (markdown) ---------- */
function md(src){
  const inline = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*]+)\*/g,'$1<em>$2</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
  const out = []; let list = null, quote = [];
  const closeList  = () => { if (list){ out.push(`</${list}>`); list = null; } };
  const closeQuote = () => { if (quote.length){ out.push(`<blockquote>${inline(quote.join('\n'))}</blockquote>`); quote = []; } };
  src.replace(/\r/g,'').split('\n').forEach(line => {
    const q = /^>\s?(.*)/.exec(line);
    if (q){ closeList(); quote.push(q[1]); return; }
    closeQuote();
    if (/^---+\s*$/.test(line)){ closeList(); out.push('<hr>'); return; }
    const h = /^(#{1,4})\s+(.*)/.exec(line);
    if (h){ closeList(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); return; }
    const ol = /^\s*\d+\.\s+(.*)/.exec(line), ul = /^\s*[-*]\s+(.*)/.exec(line);
    if (ol || ul){
      const want = ol ? 'ol' : 'ul';
      if (list !== want){ closeList(); out.push(`<${want}>`); list = want; }
      out.push(`<li>${inline((ol || ul)[1])}</li>`); return;
    }
    if (!line.trim()){ closeList(); return; }
    if (list) out.push(`<li>${inline(line.trim())}</li>`);
    else out.push(`<p>${inline(line)}</p>`);
  });
  closeList(); closeQuote();
  return out.join('\n');
}

/* ---------- rubric ---------- */
function drawRubric(){
  const el = $('rubric');
  const g = DATA[state.game];
  if (!g || !(g.versions||[]).length || !(g.questions||[]).length){ el.innerHTML = ''; return; }
  const vs = g.versions, scores = vs.map(v => score(g,v)), v = vs[state.col];
  const cols = `style="grid-template-columns:minmax(0,1fr) repeat(${vs.length},120px)"`;
  const on = i => i === state.col ? 'on' : '';

  let h = `<div class="grid hrow" ${cols}><span class="th">Criterion</span>` +
          vs.map((v,i) => `<span class="th ${on(i)}">${esc(v.label)}</span>`).join('') + `</div>`;

  let tier = null;
  g.questions.forEach((q,r) => {
    if (q.tier !== tier){ tier = q.tier; h += `<div class="tier">${esc(tier)}</div>`; }
    const m = /^\*\*(.+?)\*\*\s*[—–-]\s*([\s\S]*)$/.exec(String(q.q ?? ''));
    // A failure on the selected version shows the evaluator's reason under the criterion;
    // a ✗ in another column shows it on hover, and a click switches to that version.
    const why = v?.marks?.[r] === false ? v.comments?.[r] : null;
    h += `<div class="grid r" ${cols}><div class="crit">
        <div class="q">${m ? `<span class="area">${esc(m[1])}</span>` : ''}
          <span class="desc">${plain(m ? m[2] : q.q)}${q.rating ? ' (1–5)' : ''}</span></div>
        ${why ? `<details class="why"><summary>${svg('alert', 14, 2)}Why it failed · ${esc(v.label)}</summary>
          <p>${esc(why)}</p></details>` : ''}
      </div>` +
      vs.map((w,i) => {
        const mk = (w.marks || [])[r];
        let c;
        if (q.rating) c = typeof mk === 'number' ? `<span class="num">${mk}<small> /5</small></span>` : `<span class="u" title="Not scored">–</span>`;
        else if (mk === true) c = `<span class="dot y" title="Passed">${svg('check', 14, 2.6)}</span>`;
        else if (mk === false){
          const note = w.comments?.[r], tip = `${w.label} failed${note ? ': ' + note : ''}`;
          c = `<button class="dot n" data-k="${i}" title="${esc(tip)}" aria-label="${esc(tip)}">${svg('x', 12, 3)}</button>`;
        }
        else c = `<span class="u" title="Not scored">–</span>`;
        return `<div class="cell ${on(i)}">${c}</div>`;
      }).join('') + `</div>`;
  });

  const total = (label, get, strong) =>
    `<div class="grid r ${strong ? 'strong' : ''}" ${cols}><span class="tot-l">${esc(label)}</span>` +
    scores.map((s,i) => `<span class="tot-v ${on(i)}">${esc(get(s))}</span>`).join('') + `</div>`;
  h += `<div class="tier">Totals</div>`;
  [...new Set(g.questions.filter(q => !q.rating).map(q => q.tier))].forEach(t =>
    h += total(t.split('—')[0].trim() + ' checks', s => s.scored && s.tiers[t] ? s.tiers[t][0] + '/' + s.tiers[t][1] : '—'));
  h += total('All checks passed', scoreText, true);
  if (g.questions.some(q => q.rating))
    h += total('Rating average', s => s.avg === null ? '—' : s.avg.toFixed(2), true);

  el.innerHTML = `
    <div class="rubric-h"><h2>Rubric</h2><span>${g.questions.length} criteria · same rubric for every version</span></div>
    <div class="table"><div class="table-in">${h}</div></div>
    <div class="legend">
      <span><i style="background:var(--pass)"></i>Passed</span>
      <span><i style="background:#E9A091"></i>Failed — click to see why</span>
      <span><b style="font-family:var(--mono);font-weight:400">1–5</b>Rated</span>
      <span>–&nbsp;Not scored</span>
    </div>`;
  el.querySelectorAll('button.dot.n').forEach(b =>
    b.onclick = () => go(state.game, +b.dataset.k));
}

/* ---------- trajectory download ----------
   A version's own `trajectory` wins; otherwise the scene-level one is used. */
const trajectoryOf = () => cur()?.trajectory || DATA[state.game]?.trajectory || null;
const fileName = p => decodeURIComponent(String(p).split(/[?#]/)[0].split('/').pop()) || 'trajectory';
async function downloadTrajectory(){
  const t = trajectoryOf();
  if (!t) return;
  const a = document.createElement('a');
  a.download = fileName(t);
  try {
    // Fetching first makes cross-origin files download instead of opening in the tab.
    const res = await fetch(t);
    if (!res.ok) throw new Error(res.status);
    a.href = URL.createObjectURL(await res.blob());
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  } catch(e) {
    a.href = t;                                          // file:// or blocked fetch: let the browser handle it
  }
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- state ---------- */
function go(game, col){
  if (game !== state.game){ state.open = false; }
  state.game = game; state.col = col; state.notes = false;
  drawAll();
}
function drawAll(){
  drawNav(); drawHead(); drawCards(); drawStage(); drawRubric();
  // only a different scene/version reloads the stage; toggling notes or the prompt doesn't
  if (loadedKey !== state.game + ':' + state.col) loadScene();
}
addEventListener('resize', () => { if (!state.open) drawHead(); });
document.fonts?.ready.then(drawHead);                  // re-measure the prompt once the web font is in

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.notes){ state.notes = false; drawStage(); return; }
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const g = DATA[state.game];
  if (!g) return;
  if (e.key >= '1' && e.key <= '9' && g.versions?.[+e.key-1]) go(state.game, +e.key-1);
  else if (e.key === 'ArrowDown' && state.game < DATA.length-1) go(state.game + 1, 0);
  else if (e.key === 'ArrowUp'   && state.game > 0)             go(state.game - 1, 0);
  else if (e.key.toLowerCase() === 'r') loadScene();
  else if (e.key.toLowerCase() === 'f') openFull();
  else if (e.key.toLowerCase() === 'm') toggleNav();
  else return;
  e.preventDefault();
});

/* ---------- collapsible side menu (remembered per browser) ---------- */
function toggleNav(collapsed = !$('layout').classList.contains('collapsed')){
  $('layout').classList.toggle('collapsed', collapsed);
  const b = $('navtoggle'), label = collapsed ? 'Show game menu' : 'Hide game menu';
  b.setAttribute('aria-expanded', !collapsed);
  b.setAttribute('aria-label', label);
  b.title = label + ' (M)';
  try { localStorage.setItem('navCollapsed', collapsed ? '1' : ''); } catch(e) {}
}
$('navtoggle').innerHTML = svg('side', 18);
$('navtoggle').onclick = () => toggleNav();
try { if (localStorage.getItem('navCollapsed')) toggleNav(true); } catch(e) {}

drawAll();
</script>
</body>
